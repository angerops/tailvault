name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests and static checks
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: bash scripts/ci-release.sh --checks-only
      - name: Verify checks produced no application package
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: test ! -e bin
      - name: Validate and package main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/ci-release.sh
