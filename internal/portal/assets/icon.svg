<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#373d3e"/>
      <stop offset="1" stop-color="#171c1d"/>
    </linearGradient>
    <linearGradient id="illuminated" x2="0" y2="1">
      <stop stop-color="#b5f4d9"/>
      <stop offset="1" stop-color="#79cdb1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="url(#background)" stroke="#5b6562"/>
  <g fill="#204740" stroke="#355b52" stroke-width=".6">
    <circle cx="20" cy="14" r="4.5"/>
    <circle cx="44" cy="26" r="4.5"/>
    <circle cx="20" cy="38" r="4.5"/>
    <circle cx="44" cy="50" r="4.5"/>
  </g>
  <g fill="url(#illuminated)" stroke="#b5efd6" stroke-width=".6" filter="url(#glow)">
    <circle cx="32" cy="14" r="4.5"/>
    <circle cx="44" cy="14" r="4.5"/>
    <circle cx="20" cy="26" r="4.5"/>
    <circle cx="32" cy="26" r="4.5"/>
    <circle cx="32" cy="38" r="4.5"/>
    <circle cx="44" cy="38" r="4.5"/>
    <circle cx="20" cy="50" r="4.5"/>
    <circle cx="32" cy="50" r="4.5"/>
  </g>
</svg>
